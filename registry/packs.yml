# Industry / role packs.
# Every skill is classified into one primary pack (+ extra packs) by keyword
# scoring: a hit in the skill name counts 3x, in tags 2x, in the description 1x.
# `keywords` are lowercase stems matched as whole words or word prefixes.
# `queries` seed the weekly discovery (GitHub / HN / dev.to / ... searches).
packs:
  ai-ml:
    title: AI / ML Engineering
    summary: LLM apps, agents, RAG, prompt and eval work, model APIs, MCP, notebooks, ML research.
    keywords: [llm, ai, ml, machine, learning, model, prompt, agent, agents, rag, embedding, embeddings, eval, evals, evaluation, mcp, claude, anthropic, openai, huggingface, transformer, finetune, fine-tune, dataset, inference, notebook, pytorch, tensorflow, langchain, vector, token, tokens, benchmark, guardrail, copilot, autonomous]
    queries: ["claude skill llm", "agent skill rag evaluation", "SKILL.md machine learning", "mcp server builder skill", "prompt engineering skill claude", "llm eval skill"]
  mlops-devops:
    title: MLOps / DevOps / Cloud
    summary: CI/CD, deployment, containers, infra, monitoring, incidents, runbooks, release management.
    keywords: [mlops, devops, deploy, deployment, ci, cd, pipeline, docker, container, kubernetes, k8s, terraform, infra, infrastructure, cloud, aws, azure, gcp, vercel, monitoring, observability, incident, runbook, release, rollback, workflow, actions, github, git, ship, pr, branch, worktree, cron, schedule]
