<script>
const D=JSON.parse(document.getElementById('data').textContent);
const q=document.getElementById('q'),pk=document.getElementById('pack'),st=document.getElementById('status'),list=document.getElementById('list');
Object.entries(D.packs).sort((a,b)=>a[1].title.localeCompare(b[1].title)).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v.title;pk.appendChild(o)});
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
  const t=q.value.toLowerCase().split(/\s+/).filter(Boolean);
  const rows=D.skills.filter(s=>(!pk.value||s.pack===pk.value||(s.packs||[]).includes(pk.value))&&(!st.value||s.status===st.value)&&t.every(w=>(s.id+' '+s.name+' '+s.desc+' '+(s.tags||[]).join(' ')).toLowerCase().includes(w)));
  document.getElementById('stat').textContent=rows.length+' of '+D.skills.length+' skills · '+Object.keys(D.packs).length+' packs · generated '+D.generated;
  list.innerHTML=rows.slice(0,400).map(s=>'<div class="c"><h3>'+esc(s.id)+'</h3><span class="t">'+esc(D.packs[s.pack]?D.packs[s.pack].title:s.pack)+'</span><span class="t st-'+esc(s.status)+'">'+esc(s.status)+'</span><p>'+esc(s.desc.slice(0,220))+(s.desc.length>220?'…':'')+'</p>'+(s.source&&s.source.install?'<p><code>'+esc(s.source.install)+'</code></p>':'')+'</div>').join('');
}
[q,pk,st].forEach(e=>e.addEventListener('input',render));render();
</script></body></html>
